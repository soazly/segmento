<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Controle de Paredes</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#0f172a;
    color:#e2e8f0;
    font-size:18px;
    line-height:1.3;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.container{max-width:900px;margin:auto;padding:12px}

.tela{display:none}
.tela.active{display:block}

#main{flex-direction:column;width:100%}
#main.active{display:flex}

/* HEADER fixo no topo */
.topo{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    gap:12px;
    background:#0f172a;
    padding:10px 0;
    margin-bottom:12px;
    border-bottom:1px solid #1e293b;
}
.topo h2{font-size:22px;font-weight:700;flex:1}

/* BOTÕES */
button{
    background:#1e293b;
    color:#fff;
    border:1px solid #334155;
    padding:12px 18px;
    min-height:48px;
    border-radius:12px;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
}
button:active{background:#334155}

/* SEGMENTOS */
.segmento{
    display:flex;
    flex-direction:column;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    margin-bottom:14px;
    background:#020617;
    border:2px solid #334155;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.segmento:active{transform:scale(.98)}
.segmento img{width:100%;display:block}
.segmento span{
    order:-1;
    background:#1e293b;
    color:#22c55e;
    padding:10px 14px;
    font-size:18px;
    font-weight:700;
    text-align:center;
    border-bottom:2px solid #334155;
}

/* LISTA */
.parte{margin-top:22px}
.parte h3{
    margin-bottom:12px;
    color:#22c55e;
    font-size:22px;
    font-weight:700;
}

.linha{display:flex;gap:10px;margin-bottom:10px}

.parede-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:64px;
    padding:12px;
    text-align:center;
    border-radius:14px;
    background:#1e293b;
    font-size:19px;
    font-weight:600;
    cursor:pointer;
    border:2px solid #334155;
}
.parede-btn:active{background:#334155;transform:scale(.97)}

/* VISUAL */
.img-parede{
    background:#020617;
    border-radius:14px;
    padding:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    overflow:auto;
    max-height:calc(100dvh - 150px);
    -webkit-overflow-scrolling:touch;
}
.img-parede img{
    width:100%;
    display:block;
    object-fit:contain;
    cursor:zoom-in;
}
.img-parede.zoom img{width:220%;max-width:none;cursor:zoom-out}

.dica{
    text-align:center;
    color:#94a3b8;
    font-size:15px;
    margin-top:10px;
}

@media (min-width:600px){
    .container{padding:16px}
    .linha{gap:14px}
}
@media (min-width:900px){
    .container{max-width:1100px}
}
</style>
</head>

<body>

<div class="container">

<!-- SEGMENTOS -->
<div id="main" class="tela active">
    <div class="segmento" onclick="abrirLista(1)">
        <img src="seg1.png" alt="Segmento 1">
        <span>Segmento 1</span>
    </div>
    <div class="segmento" onclick="abrirLista(2)">
        <img src="seg2.png" alt="Segmento 2">
        <span>Segmento 2</span>
    </div>
    <div class="segmento" onclick="abrirLista(3)">
        <img src="seg3.png" alt="Segmento 3">
        <span>Segmento 3</span>
    </div>
    <div class="segmento" onclick="abrirLista(4)">
        <img src="seg4.png" alt="Segmento 4">
        <span>Segmento 4</span>
    </div>
</div>

<!-- LISTA -->
<div id="lista" class="tela">
    <div class="topo">
        <button onclick="voltar()">⬅ Voltar</button>
        <h2 id="titulo"></h2>
    </div>
    <div id="conteudoLista"></div>
</div>

<!-- VISUAL -->
<div id="visual" class="tela">
    <div class="topo">
        <button onclick="voltarLista()">⬅ Lista</button>
        <h2 id="tituloParede"></h2>
    </div>
    <div class="img-parede" id="boxParede">
        <img id="imgParede" alt="Parede" onclick="alternarZoom()">
    </div>
    <p class="dica">Toque na imagem para ampliar</p>
</div>

</div>

<script>

const segmentos = {

1: {
A: [
["p7e","p3e"],
["p15e","p5"],
["p16e","p8"]
],
B: [
["p2","p12e"],
["p25e","p12d"],
["p14","p13e"],
["","p13d"],
["","p4"],
["","p4"]
],
C: [
["p10e","p1"],
["p11e","p6"],
["","p9e"]
]
},

2: {
A: [
["p7d","p3d"],
["p15d","p5"],
["p17e","p26"]
],
B: [
["p2","p12e"],
["p25d","p12d"],
["p14","p13e"],
["","p13d"],
["","p4"],
["","p4"]
],
C: [
["p10d","p1"],
["p11d","p6"],
["","p9d"]
]
},

3: {
A: [
["p7d","p3d"],
["p15d","p5"],
["p16d","p8"]
],
B: [
["p2","p12e"],
["p25d","p12d"],
["p14","p13e"],
["","p13d"],
["","p4"],
["","p4"]
],
C: [
["p10d","p1"],
["p11d","p6"],
["","p9d"]
]
},

4: {
A: [
["p7e","p3e"],
["p15e","p5"],
["p17d","p26"]
],
B: [
["p2","p12e"],
["p25e","p12d"],
["p14","p13e"],
["","p13d"],
["","p4"],
["","p4"]
],
C: [
["p10e","p1"],
["p11e","p6"],
["","p9e"]
]
}

};

function trocarTela(id){
    document.querySelectorAll(".tela").forEach(t=>t.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo(0,0);
}

function abrirLista(seg){
    window.segmentoAtual = seg;
    document.getElementById("titulo").innerText = "Segmento " + seg;
    renderLista();
    trocarTela("lista");
}

function renderLista(){
    let seg = segmentos[segmentoAtual];
    let html = "";

    for(let parte in seg){
        html += `<div class="parte"><h3>Parte ${parte}</h3>`;

        seg[parte].forEach(linha=>{
            html += `<div class="linha">`;

            linha.forEach(p=>{
                if(p){
                    html += `<div class="parede-btn" onclick="abrirParede('${p}')">${formatar(p)}</div>`;
                } else {
                    html += `<div style="flex:1"></div>`;
                }
            });

            html += `</div>`;
        });

        html += `</div>`;
    }

    document.getElementById("conteudoLista").innerHTML = html;
}

function formatar(id){
    let num = id.match(/\d+/)[0];
    let lado = id.includes("e") ? "E" : id.includes("d") ? "D" : "";
    return `Parede ${num} ${lado}`;
}

function abrirParede(id){
    document.getElementById("tituloParede").innerText = formatar(id);
    document.getElementById("boxParede").classList.remove("zoom");
    document.getElementById("imgParede").src = id + ".png";
    trocarTela("visual");
}

function alternarZoom(){
    document.getElementById("boxParede").classList.toggle("zoom");
}

function voltar(){ trocarTela("main"); }
function voltarLista(){ trocarTela("lista"); }

</script>

</body>
</html>
